<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4E9C1"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8F7220"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="75%">
      <stop stop-color="#D4AF37" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#spot)"/>
  <rect width="1200" height="630" fill="url(#vign)"/>
  <rect width="1200" height="630" filter="url(#noise)" opacity="0.04"/>

  <!-- top + bottom hairlines -->
  <rect x="80" y="78" width="1040" height="1" fill="#D4AF37" opacity="0.4"/>
  <rect x="80" y="552" width="1040" height="1" fill="#D4AF37" opacity="0.4"/>

  <!-- corner ticks -->
  <g stroke="#D4AF37" stroke-width="2" opacity="0.7">
    <path d="M80 60 V40 H100"/>
    <path d="M1120 60 V40 H1100"/>
    <path d="M80 570 V590 H100"/>
    <path d="M1120 570 V590 H1100"/>
  </g>

  <!-- KD monogram -->
  <g transform="translate(96, 210)">
    <rect x="0" y="0" width="200" height="200" rx="44" fill="#0F0F10"/>
    <rect x="1.5" y="1.5" width="197" height="197" rx="42.5" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="3"/>
    <g stroke="url(#gold)" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(20,20) scale(1.6)">
      <path d="M30 28 V72"/>
      <path d="M30 50 L48 28"/>
      <path d="M30 50 L48 72"/>
      <path d="M58 28 V72"/>
      <path d="M58 28 C74 28 80 38 80 50 C80 62 74 72 58 72"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="350" y="250" font-family="'Clash Display','Cormorant Garamond',Georgia,serif" font-size="78" font-weight="600" fill="#FFFFFF" letter-spacing="-1">K-DESIGN</text>
  <text x="352" y="318" font-family="'Clash Display','Cormorant Garamond',Georgia,serif" font-size="42" font-weight="400" fill="url(#gold)" letter-spacing="14">PICTURES</text>
  <text x="354" y="392" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="400" fill="#B0B0B0">We turn stories into powerful visual experiences.</text>

  <!-- footer label -->
  <text x="80" y="528" font-family="'Space Mono',monospace" font-size="18" fill="#8A8A8A" letter-spacing="3">AUDIOVISUAL PRODUCTION STUDIO</text>
  <text x="1120" y="528" text-anchor="end" font-family="'Space Mono',monospace" font-size="18" fill="#8A8A8A" letter-spacing="3">YAOUNDÉ · CAMEROON</text>
</svg>
